name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality and configuration tools
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.12.8
          sudo apt-get update
          sudo apt-get install --yes caddy prometheus shellcheck
          command -v caddy
          command -v promtool
          command -v shellcheck
      - name: Run repository checks
        run: ./scripts/check
