name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality and configuration tools
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.12.8
          sudo apt-get update
          sudo apt-get install --yes caddy golang-go prometheus shellcheck
          go install github.com/caddyserver/xcaddy/cmd/xcaddy@v0.4.4
          "$HOME/go/bin/xcaddy" build --output "$RUNNER_TEMP/caddy" --with github.com/caddy-dns/cloudflare
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          command -v caddy
          command -v promtool
          command -v shellcheck
      - name: Run repository checks
        run: ./scripts/check
