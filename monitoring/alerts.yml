groups:
  - name: gp-cloud-host
    rules:
      - alert: GpCloudLowDisk
        expr: (1 - gp_cloud_disk_free_bytes / gp_cloud_disk_total_bytes) > 0.80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: gp-cloud root filesystem is above 80%
      - alert: GpCloudDeploymentFailures
        expr: increase(gp_cloud_deployment_failures_total[1h]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: gp-cloud has repeated deployment failures
      - alert: GpCloudControlUnavailable
        expr: up{job="gp-cloud"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: gp-cloud control metrics are unavailable
